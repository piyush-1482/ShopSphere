name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - Build and Push to ECR
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" << 'EOF'

            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin \
              969212888523.dkr.ecr.ap-south-1.amazonaws.com

            docker pull \
              969212888523.dkr.ecr.ap-south-1.amazonaws.com/shopsphere-backend:latest

            docker pull \
              969212888523.dkr.ecr.ap-south-1.amazonaws.com/shopsphere-frontend:latest

            docker rm -f shopsphere-backend || true
            docker rm -f shopsphere-frontend || true

            docker run -d \
              --name shopsphere-backend \
              --restart unless-stopped \
              --env-file /home/ec2-user/backend.env \
              --network shopsphere-network \
              -p 5000:5000 \
              969212888523.dkr.ecr.ap-south-1.amazonaws.com/shopsphere-backend:latest

            docker run -d \
              --name shopsphere-frontend \
              --restart unless-stopped \
              --network shopsphere-network \
              -p 5173:80 \
              969212888523.dkr.ecr.ap-south-1.amazonaws.com/shopsphere-frontend:latest

            docker ps

          EOF
