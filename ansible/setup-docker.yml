---
- name: Configure Docker on ShopSphere EC2
  hosts: web
  become: true

  tasks:
    - name: Update installed packages
      dnf:
        name: "*"
        state: latest

    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start Docker service
      systemd:
        name: docker
        state: started

    - name: Enable Docker at boot
      systemd:
        name: docker
        enabled: true

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: true
